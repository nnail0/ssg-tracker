[project]
name = "ssg-tracker"
version = "0.1.0"
description = "A NanoSat tracker for use in the University of New Mexico's Small Satellite Group"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aprslib>=0.7.2",
    "cython>=3.3.0",
    "folium>=0.20.0",
    "geopy>=2.5.0",
    "lorarf>=1.4.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "pyproj>=3.7.2",
    "pyserial>=3.5",
    "pyside6>=6.11.2",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "streamlit>=1.63.0",
    "sympy>=1.14.0",
]
